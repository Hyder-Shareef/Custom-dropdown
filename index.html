<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="dropdown-wrapper">
      <label id="dropdown-label" class="dropdown-label" for="dropdown-trigger">
        Select Option
      </label>

      <div class="dropdown" id="dropdown">
        <button
          type="button"
          class="dropdown-trigger"
          id="dropdown-trigger"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-labelledby="dropdown-label dropdown-selected-text"
          aria-controls="dropdown-options"
        >
          <span class="selected-text placeholder" id="dropdown-selected-text">Select an option</span>
          <span class="arrow-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </span>
        </button>

        <ul
          class="dropdown-options"
          id="dropdown-options"
          role="listbox"
          aria-labelledby="dropdown-label"
          tabindex="-1"
        >
          <li class="dropdown-option" role="option" aria-selected="false" data-value="Option 1" id="option-0">
            <span class="option-label">Option 1</span>
            <span class="check-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
              </svg>
            </span>
          </li>
          <li class="dropdown-option" role="option" aria-selected="false" data-value="Option 2" id="option-1">
            <span class="option-label">Option 2</span>
            <span class="check-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
              </svg>
            </span>
          </li>
          <li class="dropdown-option" role="option" aria-selected="false" data-value="Option 3" id="option-2">
            <span class="option-label">Option 3</span>
            <span class="check-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
              </svg>
            </span>
          </li>
          <li class="dropdown-option" role="option" aria-selected="false" data-value="Option 4" id="option-3">
            <span class="option-label">Option 4</span>
            <span class="check-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
              </svg>
            </span>
          </li>
          <li class="dropdown-option" role="option" aria-selected="false" data-value="Option 5" id="option-4">
            <span class="option-label">Option 5</span>
            <span class="check-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
              </svg>
            </span>
          </li>
        </ul>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
